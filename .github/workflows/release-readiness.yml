name: release readiness

# This repository's own CI — never shipped to adopters. `main` is the
# branch releases are cut from, so every push to it — including one that
# lands without a pull request — gets a releasability verdict here.
#
# **A red main that a script can fix is the bot's to fix**
# (docs/technical/README.md#distribution). Three phases, one job:
# regenerate (the template sync), heal (commit the regeneration when it
# changed anything, with the same token and the same rebase-not-force
# push, unretried — readiness_heal.sh's header says why), verdict (the
# full suite, on the tree as pushed). A GITHUB_TOKEN push triggers no
# new runs — which is why the
# verdict runs here, in the run that healed, rather than waiting for a
# run the sync commit will never cause. Red is reserved for what
# regeneration cannot repair.
#
# The cut itself deliberately stays local (`make release`): the stamp
# commit cannot be pushed to a protected main by GITHUB_TOKEN, and the
# tokens that could are the dependency this project rejects. The script
# re-runs these same guards before tagging.
#
# YAML here is wiring only; every phase executes things the suite
# already owns.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  readiness:
    name: script suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate what a script owns
        run: make template-sync

      - name: Heal — commit the regeneration, if it changed anything
        run: bash .github/scripts/readiness_heal.sh main

      - name: Verdict — the full suite, on the healed tree
        run: bash tests/run.sh
