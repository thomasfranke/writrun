name: writrun approve

# Records the `draft -> approved` transition once the maintainer has
# assented. **Here the assenting act is the merge**, not an approving
# review (docs/product/stage-2-pull-requests/approval.md, and this repository's
# own answer in AGENTS.md): every pull request here is authored by its
# maintainer, and no forge lets a person approve their own, so a
# review-based gate would never be satisfiable — and an unsatisfiable gate
# gets worked around, which is worse than no gate.
#
# The gate loses no strength. Only an account with write access can merge,
# so the merge *is* the proof the old `author_association` filter stood in
# for; a second test would assert something the forge already guarantees.
#
# `pull_request_target`, not `pull_request`: only the former carries a
# write token when the head is a fork. That is a gain, not a workaround —
# the review-based flow had to skip fork pull requests entirely, and this
# one serves them like any other, because by the time it runs the code is
# already on the base branch. Nothing from the head is checked out or
# executed here; the only input taken from the event is a pair of SHAs.
#
# What this depends on:
#   - Actions must have write permission (Settings > Actions > General >
#     Workflow permissions). That setting is a ceiling; the `permissions:`
#     block below cannot rise above it.
#   - **The base branch must accept a push from the Actions token.** The
#     flip now lands on the base branch itself, after the merge — which
#     this repository allows because `main` is unprotected. Protecting it
#     later means letting this token through, or the recording stops and
#     specs stay `draft` after their merge.
#   - Pushes made with GITHUB_TOKEN trigger no workflow runs. That is what
#     keeps this from looping, and it means no check reports on the flip
#     commit — acceptable because the commit is deterministic and the
#     checks passed on the exact state it was derived from
#     (docs/technical/decisions/).

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  gate:
    name: adoption stage
    runs-on: ubuntu-latest
    # The level gates the whole workflow rather than each job, and it is a
    # job rather than a first step so a project below the level starts no
    # runner at all. It always succeeds: a job that did not run is not a
    # failure, and stage_gate.sh says which of the two happened.
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: bash .writrun/scripts/stage-2-pull-requests/stage_gate.sh 2

  approve-specs:
    # Merged, not merely closed. A pull request abandoned without merging
    # carried no assent, and its specs stay draft.
    needs: gate
    if: github.event.pull_request.merged == true && needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Flip draft specs the merge approved
        # Which specs qualify — added by the PR, or returned approved→draft
        # by the PR itself (an amendment) — is documented in the script,
        # which the test suite's integration tier executes.
        #
        # The range is derived from the merge commit, never from the head
        # branch: a merge may already have deleted it, and for a squash
        # merge the head's commits do not exist on the base at all.
        id: flip
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          out=$(bash .writrun/scripts/stage-2-pull-requests/flip_approved_specs.sh \
            "${MERGE_SHA}~1...${MERGE_SHA}")
          printf '%s\n' "$out"
          if [ -n "$out" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
          # The spec files themselves, for the re-derivation below: which
          # tasks this merge approved is exactly what it just decided, and
          # re-deriving that from the range a second time would be a
          # second chance to disagree with itself.
          specs=$(printf '%s\n' "$out" | sed -n 's/^approved //p' | tr '\n' ' ')
          echo "specs=${specs}" >> "$GITHUB_OUTPUT"

      - name: Stamp the dates this merge earned
        # The machinery's two dates, written where the merge can be seen
        # — a hand-written one would have to be typed before the event it
        # records (docs/product/pipeline.md#flows-and-statuses). Same
        # range the flip used, and the merge commit's **own** time rather
        # than the moment this workflow happened to run, so the queue
        # orders by what happened and not by how busy the runners were.
        id: stamp
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # `format-local`, not `format`: the latter renders the commit
          # in **its own** timezone and would append a `Z` to a local
          # time — a timestamp that sorts wrong by exactly the offset it
          # lies about, which is the failure 0049 exists to prevent.
          when=$(TZ=UTC0 git show -s --format=%cd \
            --date=format-local:%Y-%m-%dT%H:%M:%SZ "${MERGE_SHA}")
          out=$(bash .writrun/scripts/stage-2-pull-requests/stamp_task_dates.sh \
            "${MERGE_SHA}~1...${MERGE_SHA}" "$when")
          printf '%s\n' "$out"
          if [ -n "$out" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the tasks this merge decided
        # After the flips and the stamps, in the same working tree: done
        # where the merge carried the worker's completed date, back to
        # rest where it carried partial work, backlog -> ready where the
        # approvals it recorded made a task ready. One event, one commit
        # (product/stage-1-tasks-and-specs/statuses.md).
        id: status
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          head_task=""
          case "$PR_HEAD_REF" in
            task/[0-9]*) head_task=$(printf '%s' "$PR_HEAD_REF" | sed -E 's|^task/([0-9]+).*|task-\1|') ;;
          esac
          out=$(bash .writrun/scripts/stage-2-pull-requests/record_task_status.sh \
            "${MERGE_SHA}~1...${MERGE_SHA}" "$head_task")
          printf '%s\n' "$out"
          if [ -n "$out" ]; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi
          # The moved task ids, for the label re-derivation below — the
          # same no-second-derivation rule the spec list follows.
          tasks=$(printf '%s\n' "$out" | sed -n 's|^moved work/tasks/\(task-[0-9]*\).*|\1|p' | sort -u | tr '\n' ' ')
          echo "tasks=${tasks}" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.flip.outputs.changed == '1' || steps.stamp.outputs.changed == '1' || steps.status.outputs.changed == '1'
        # COMMIT_TITLE is the adopter's to edit: it only has to satisfy the
        # adopting project's own commit convention — nothing in WritRun
        # parses commit messages.
        env:
          COMMIT_TITLE: "chore(queue): record what the merge decided"
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `work/` and not `work/specs`: the flip and the stamps are one
          # commit, because they record one event — the merge that just
          # happened — and two commits would let a reader believe the
          # queue passed through a state where only half of it was true.
          git add work
          git commit \
            -m "$COMMIT_TITLE" \
            -m "Assent given by @${MERGED_BY} merging #${PR_NUMBER}."
          # Another change may have landed between the merge and this run.
          # Rebase onto it rather than force: the flip is an addition to
          # the branch's history, never a replacement of it.
          git pull --rebase origin "$BASE_REF"
          git push origin "HEAD:${BASE_REF}"

      - name: Re-derive the label of every task this merge moved
        if: steps.flip.outputs.changed == '1' || steps.status.outputs.changed == '1'
        # Sequential in the same job, and deliberately *after* the commit:
        # the script reads the queue from disk, and the flip is only in
        # the queue once it has been written there. Reading the merge's
        # own diff instead is what made `status:ready` unreachable —
        # right for what the merge carried, wrong for what it caused
        # (docs/product/stage-3-github-issues/labels.md).
        #
        # A label is not a file, so nothing here is committed or pushed;
        # this step cannot race the push above because it follows it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash .writrun/scripts/stage-3-github-issues/rederive_labels.sh \
            "${{ github.repository }}" ${{ steps.flip.outputs.specs }} ${{ steps.status.outputs.tasks }}
